name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test mod
        run: .\gradlew.bat clean build --no-daemon --console=plain
      - name: Test MCP server
        run: node .\mcp\self-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mineclient-bridge-neoforge-1.21.1
          path: build/libs/*.jar
